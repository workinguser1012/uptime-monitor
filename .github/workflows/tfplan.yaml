name: terraform-plan


on:
  workflow_dispatch:

  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/tf*.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.14.9"   
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend needed to validate)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: Lint
        run: tflint --recursive || true

      
      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  plan:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.11.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Init
        run: terraform init -input=false

      
      - name: Plan
        run: terraform plan -input=false -var "frontend_image=${{ vars.ECR_REGISTRY }}/uptime-monitor-frontend:plan-placeholder"